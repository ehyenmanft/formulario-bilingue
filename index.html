<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Bilingüe / Bilingual Form</title>
  <meta name="description" content="Formulario moderno bilingüe conectado a Google Sheets">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo dinámico sutil con resplandor -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-wrapper">
    <!-- Barra superior de controles: Modo Oscuro/Claro y Selector de Idioma -->
    <header class="top-controls">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span id="brand-status" class="brand-text">Formulario Activo</span>
      </div>

      <div class="controls-group">
        <!-- Switch de Tema (Light / Dark) -->
        <button id="theme-toggle" class="control-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
          <!-- Icono Sol (para cuando está en oscuro) -->
          <svg id="icon-sun" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Icono Luna (para cuando está en claro) -->
          <svg id="icon-moon" class="theme-icon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Selector de Idioma -->
        <div class="lang-segmented" role="radiogroup" aria-label="Idioma / Language">
          <button type="button" id="btn-lang-es" class="lang-option active" onclick="setLanguage('es')">
            <span>ES</span>
          </button>
          <button type="button" id="btn-lang-en" class="lang-option" onclick="setLanguage('en')">
            <span>EN</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Contenedor del Formulario -->
    <main class="form-container">
      <div class="card header-card">
        <h1 id="form-main-title" class="title-gradient">Cargando...</h1>
        <p id="form-main-desc" class="desc-text"></p>
        <div class="form-meta">
          <span class="required-indicator"><span class="star">*</span> <span id="text-required-legend">Campos obligatorios</span></span>
        </div>
      </div>

      <form id="dynamic-form" class="card form-body" onsubmit="handleFormSubmit(event)" novalidate>
        <div id="questions-grid" class="form-grid">
          <!-- Preguntas generadas dinámicamente -->
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="primary-btn">
            <span class="btn-spinner" id="btn-spinner" style="display: none;"></span>
            <span id="btn-text">Enviar respuesta</span>
            <svg class="btn-arrow" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </form>

      <!-- Tarjeta de Confirmación de Envío -->
      <div id="success-card" class="card success-card" style="display: none;">
        <div class="success-icon-wrapper">
          <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>
        <h2 id="success-title" class="success-heading">¡Respuesta registrada con éxito!</h2>
        <p id="success-message" class="success-body">Tus datos han sido enviados y sincronizados directamente con Google Sheets.</p>
        <button type="button" class="secondary-btn" onclick="resetForm()">
          <span id="btn-new-response">Enviar otra respuesta</span>
        </button>
      </div>
    </main>

    <footer class="app-footer">
      <p id="footer-text">Conexión directa segura con Google Workspace</p>
    </footer>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
